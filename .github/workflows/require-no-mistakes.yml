name: Require no-mistakes
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    steps:
      - uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@5732d1ed88a1572fa6115d6ede5d69bfec097946
        with:
          exempt-head-branches: update/flake-lock
